services:
  - type: web
    name: fun-chat-bot
    env: python
    plan: free
    rootDir: .
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-20b"
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: "."
      - key: PYTHON_VERSION
        value: "3.12.9"
